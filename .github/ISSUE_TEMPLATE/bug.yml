name: Bug
description: Reproducible product or production defect
title: "fix: "
labels: [bug]
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Version, build number and commit
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs, save file, screenshot or crash identifier
